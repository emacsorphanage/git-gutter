name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs-version:
          - 27.2
          - 28.2
          - 29.4
          - 30.2
          - 31.1
        experimental: [false]
        include:
        - os: ubuntu-latest
          emacs-version: snapshot
          experimental: true
        - os: macos-latest
          emacs-version: snapshot
          experimental: true
        - os: windows-latest
          emacs-version: snapshot
          experimental: true
        exclude:
          - os: macos-latest
            emacs-version: 27.2
          # setup-emacs-windows has no build of 31.1 (HTTP 404).
          - os: windows-latest
            emacs-version: 31.1

    steps:
    - uses: actions/checkout@v7

    - uses: jcs090218/setup-emacs@master
      with:
        version: ${{ matrix.emacs-version }}

    - uses: emacs-eask/setup-eask@master
      with:
        version: 'snapshot'

    # package-build, which `eask package` installs from MELPA, requires
    # Emacs 29.1 since version 20260924.1014.
    - name: Package and compile
      if: matrix.emacs-version != '27.2' && matrix.emacs-version != '28.2'
      run:
        make ci

    - name: Compile
      if: matrix.emacs-version == '27.2' || matrix.emacs-version == '28.2'
      run:
        make clean compile

    # The jj tests skip without jj; on Linux they must run.
    - name: Install jj
      if: runner.os == 'Linux'
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -sSL https://github.com/jj-vcs/jj/releases/download/v0.45.1/jj-v0.45.1-x86_64-unknown-linux-musl.tar.gz \
          | tar xz -C "$HOME/.local/bin" ./jj
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "GIT_GUTTER_TEST_REQUIRE_JJ=1" >> "$GITHUB_ENV"
        "$HOME/.local/bin/jj" --version

    - name: Run tests
      run:
        make test
